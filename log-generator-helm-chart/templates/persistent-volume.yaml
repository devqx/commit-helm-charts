apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.volumeMount.name }}

spec:
  storageClassName: prod-efs-storage-class
  capacity:
    storage: {{ .Values.pv.capacity.storage }}
  accessModes:
    - ReadWriteOnce
  csi:
    driver: efs.csi.aws.com
    volumeHandle: {{ .Values.volumeHandle }}
